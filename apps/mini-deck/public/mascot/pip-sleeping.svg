<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pip, sleeping">
<title>Pip, sleeping</title>
<style>
.pp{animation:pp-bob 3.2s ease-in-out infinite;transform-origin:64px 116px}
.pp-eyes{animation:pp-blink 5s infinite;transform-origin:64px 65px}
.pp-sprout{animation:pp-sway 4s ease-in-out infinite;transform-origin:64px 31px}
@keyframes pp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes pp-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes pp-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.pp-z{animation:pp-zz 3s ease-in-out infinite;opacity:0}.pp-z:nth-child(2){animation-delay:1s}.pp-z:nth-child(3){animation-delay:2s}@keyframes pp-zz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}.pp{animation-duration:4.5s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
