name: CI

# The same gates as .husky/pre-push, on every push to main and every pull
# request: lint, then the core unit suite. The static demo site is built and
# published by demo-pages.yml.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # .npmrc omits dev dependencies by default; ESLint is one of them.
      - run: npm ci --include=dev
      # Some tests build throwaway git repositories and commit into them.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm run lint
      - run: npm run test:core
