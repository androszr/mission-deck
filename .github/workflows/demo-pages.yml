name: Demo site

# Builds the static demo (scripts/demo-export.js --site) and publishes it to
# GitHub Pages. The exporter uses Node built-ins only, so there is no install
# step. Nothing here reads a secret.
#
# One-time setup: in the repository's Settings > Pages, set Source to
# "GitHub Actions". Until then the configure-pages step fails.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'index.html'
      - 'css/**'
      - 'styles.css'
      - 'assets/**'
      - 'js/**'
      - 'fonts/**'
      - 'scripts/demo-export.js'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the site
        run: node scripts/demo-export.js --site _site
      - name: Public check - the site never fetches /api/
        run: |
          if grep -rIl "fetch(['\"\`]/api/" _site; then
            echo "A built file fetches /api/" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
