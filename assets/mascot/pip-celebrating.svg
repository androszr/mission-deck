<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pip, celebrating">
<title>Pip, celebrating</title>
<style>
.pp{animation:pp-bob 3.2s ease-in-out infinite;transform-origin:64px 116px}
.pp-eyes{animation:pp-blink 5s infinite;transform-origin:64px 65px}
.pp-sprout{animation:pp-sway 4s ease-in-out infinite;transform-origin:64px 31px}
@keyframes pp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes pp-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes pp-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.pp-jump{animation:pp-jp .9s ease-in-out infinite;transform-origin:64px 116px}@keyframes pp-jp{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}.pp-cf{animation:pp-cf 1.8s linear infinite}.pp-cf:nth-child(2n){animation-delay:.6s}.pp-cf:nth-child(3n){animation-delay:1.2s}@keyframes pp-cf{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
