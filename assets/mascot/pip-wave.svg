<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pip, waving">
<title>Pip, waving</title>
<style>
.pp{animation:pp-bob 3.2s ease-in-out infinite;transform-origin:64px 116px}
.pp-eyes{animation:pp-blink 5s infinite;transform-origin:64px 65px}
.pp-sprout{animation:pp-sway 4s ease-in-out infinite;transform-origin:64px 31px}
@keyframes pp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes pp-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes pp-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.pp-wave{animation:pp-wv 1.1s ease-in-out infinite;transform-origin:102px 74px}@keyframes pp-wv{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
